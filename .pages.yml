actions:
  - name: deploy-site
    label: Deploy site
    workflow: deploy.yml
    confirm:
      title: Deploy site?
      message: This will trigger the deployment workflow.
      button: Deploy

media:
  input: public
  output: /

content:
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        label: Title
        required: true
      - name: originally_written
        type: date
        label: Originally Written
      - name: last_edited
        type: date
        label: Last Edited
      - name: description
        type: string
        label: Description
      - name: tags
        type: string
        label: Tags
        list: true
      - name: featured
        type: boolean
        label: Featured
      - name: image
        type: image
        label: Cover Image
      - name: body
        type: rich-text
        label: Body

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        label: Title
        required: true
      - name: date
        type: date
        label: Date
        required: true
      - name: description
        type: string
        label: Description
      - name: tags
        type: string
        label: Tags
        list: true
      - name: featured
        type: boolean
        label: Featured
      - name: image
        type: image
        label: Cover Image
      - name: link
        type: string
        label: External Link
      - name: github
        type: string
        label: GitHub Repository
      - name: body
        type: rich-text
        label: Body